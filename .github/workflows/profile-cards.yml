name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Draw the cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          node scripts/frozen-calendar.mjs "$OWNER" assets/frozen-calendar.svg
          node scripts/contributed-languages.mjs "$OWNER" assets/contributed-languages.svg --no-markdown

      - name: Commit if they changed
        run: |
          git add assets/frozen-calendar.svg assets/contributed-languages.svg
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile cards"
          git push
